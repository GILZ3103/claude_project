; ESP32 BLE positioning beacon — advertises VENUE_SERVICE_UUID + an anchor id
; so the customer's phone (apps/web Map page, Web Bluetooth) can trilaterate.
;
; Flash each ESP32 with the matching environment:
;   pio run -e anchor1 -t upload   (or anchor2, anchor3)
; ANCHOR_MINOR must match a positioning_anchors.beacon_minor row in the database.

[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -DCORE_DEBUG_LEVEL=0

[env:anchor1]
extends     = common
build_flags = ${common.build_flags} -DANCHOR_MINOR=1

[env:anchor2]
extends     = common
build_flags = ${common.build_flags} -DANCHOR_MINOR=2

[env:anchor3]
extends     = common
build_flags = ${common.build_flags} -DANCHOR_MINOR=3
