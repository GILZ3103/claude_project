; ESP32 BLE positioning beacon — advertises VENUE_SERVICE_UUID + an anchor id
; so the customer's phone (apps/web Map page, Web Bluetooth) can trilaterate.
;
; Build/flash ONE beacon per anchor, changing ANCHOR_MINOR (see src/main.cpp)
; to match a positioning_anchors.beacon_minor row in the database.

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
