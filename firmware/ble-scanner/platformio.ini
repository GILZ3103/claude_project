; BLE anchor scanner — flash to a spare ESP32 to verify beacon coverage
; and calibrate rssi_at_1m / path_loss_n before updating the database.
;
;   pio run -e scanner -t upload && pio device monitor

[env:scanner]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   = -DCORE_DEBUG_LEVEL=0
