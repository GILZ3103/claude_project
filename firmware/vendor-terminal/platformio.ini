[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    miguelbalboa/MFRC522@^1.4.10
    bblanchon/ArduinoJson@^6.21.5
    bogde/HX711@^0.7.5

monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

; --- Provisioning sketch (run once to write NVS, then switch back to esp32dev) ---
[env:provision]
platform  = espressif32
board     = esp32dev
framework = arduino
build_src_filter = -<*> +<../provision/>
monitor_speed = 115200
upload_speed  = 921600

; --- HX711 raw reading test (calibrate scale_factor, then switch back to esp32dev) ---
[env:hx711-test]
platform  = espressif32
board     = esp32dev
framework = arduino
lib_deps  = bogde/HX711@^0.7.5
build_src_filter = -<*> +<../hx711-test/>
monitor_speed = 115200
upload_speed  = 921600
